{% extends "base.html" %}{% block title %}Party Planner{% endblock %}{% block content %}<section class="planner"><div><span class="eyebrow">Party Planner</span><h1>Allocate your event budget</h1></div><form id="party-form" class="card form-grid"><label>Budget (₹)<input type="number" name="budget" min="1000" step="100" required></label><label>Guests<input type="number" name="guests" min="1" value="25" required></label><label>Event type<select name="event_type"><option>Birthday</option><option>Wedding</option><option>Corporate</option><option>Anniversary</option><option>Get-together</option></select></label><label>Venue type<select name="venue_type"><option>Indoor</option><option>Outdoor</option><option>Restaurant</option><option>Hotel</option><option>Home</option></select></label><label>City<input name="city" placeholder="Chennai"></label><label class="full">Notes<textarea name="notes"></textarea></label><button class="btn full" type="submit">Generate party plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script>bindJsonPlanner('party-form','/api/generate-party')</script>{% endblock %}
