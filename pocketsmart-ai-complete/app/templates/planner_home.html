{% extends "base.html" %}{% block title %}Home Planner{% endblock %}{% block content %}<section class="planner"><div><span class="eyebrow">Home Interior Planner</span><h1>Build a room within budget</h1></div><form id="home-form" class="card form-grid"><label>Budget (₹)<input type="number" name="budget" min="1000" step="100" required></label><label>Room type<select name="room_type"><option>Living Room</option><option>Bedroom</option><option>Kitchen</option><option>Dining Room</option><option>Home Office</option></select></label><label>Style<select name="style"><option>Modern</option><option>Minimal</option><option>Traditional</option><option>Luxury</option><option>Bohemian</option></select></label><label>Lights<input type="number" name="lights" value="2" min="0"></label><label>Fans<input type="number" name="fans" value="1" min="0"></label><label>Tables<input type="number" name="tables" value="1" min="0"></label><label class="full">Notes<textarea name="notes" placeholder="Colors, materials, special needs..."></textarea></label><button class="btn full" type="submit">Generate home plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script>bindJsonPlanner('home-form','/api/generate-home')</script>{% endblock %}
