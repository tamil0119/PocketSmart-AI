{% extends "base.html" %}{% block title %}Jewelry Planner{% endblock %}{% block content %}<section class="planner"><div><span class="eyebrow">Jewelry Planner</span><h1>Match the occasion and outfit</h1></div><form id="jewelry-form" class="card form-grid" enctype="multipart/form-data"><label>Budget (₹)<input type="number" name="budget" min="500" step="100" required></label><label>Occasion<select name="occasion"><option>Wedding</option><option>Party</option><option>Festival</option><option>Office</option><option>Casual</option></select></label><label>Style<select name="style"><option>Elegant</option><option>Traditional</option><option>Minimal</option><option>Statement</option><option>Contemporary</option></select></label><label>Outfit color<input name="outfit_color" placeholder="e.g. maroon and gold"></label><label class="full">Outfit image (optional)<input type="file" name="image" accept="image/*"></label><label class="full">Notes<textarea name="notes"></textarea></label><button class="btn full" type="submit">Generate jewelry plan</button></form><div id="result"></div></section>{% endblock %}{% block scripts %}<script>bindFormPlanner('jewelry-form','/api/generate-jewelry')</script>{% endblock %}
