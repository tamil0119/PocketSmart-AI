<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>{% block title %}PocketSmart AI{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/images/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
</head>

<body>

    <nav>
        <a class="brand" href="/">PocketSmart AI</a>
        <div>
            {% if user %}
            <a href="/dashboard">Dashboard</a>
            <a href="/history">History</a>
            <a href="/logout">Logout</a>
            {% else %}
            <a href="/login">Login</a>
            <a class="btn small" href="/register">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer>
        Budget smarter with AI-assisted planning. Product prices and availability must be verified on the linked
        platform.
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}

</body>

</html>
